<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Advance Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">

  <div class="login-card">
    <i class="fa-solid fa-lock login-icon"></i>
    <h1>Admin Login</h1>
    <p class="login-sub">Advance Tools &amp; Spare Parts Hub</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="password" name="password" placeholder="Enter admin password" required autofocus>
      <button type="submit" class="admin-btn">Sign In</button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to site
    </a>
  </div>

</body>
</html>
