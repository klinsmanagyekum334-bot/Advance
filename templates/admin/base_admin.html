<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <a href="{{ url_for('admin_dashboard') }}" class="admin-logo">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <span>Admin Panel</span>
    </a>

    <nav class="admin-nav">
      <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
        <i class="fa-solid fa-gauge"></i> Dashboard
      </a>
      <a href="{{ url_for('admin_tools') }}" class="{% if request.endpoint and request.endpoint.startswith('admin_tool') %}active{% endif %}">
        <i class="fa-solid fa-toolbox"></i> Tools
      </a>
      <a href="{{ url_for('admin_services') }}" class="{% if request.endpoint == 'admin_services' %}active{% endif %}">
        <i class="fa-solid fa-list-check"></i> Services
      </a>
      <a href="{{ url_for('admin_comments') }}" class="{% if request.endpoint == 'admin_comments' %}active{% endif %}">
        <i class="fa-solid fa-comments"></i> Comments
      </a>
      <a href="{{ url_for('admin_site') }}" class="{% if request.endpoint == 'admin_site' %}active{% endif %}">
        <i class="fa-solid fa-pen-to-square"></i> Site Content
      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="{{ url_for('index') }}" target="_blank"><i class="fa-solid fa-eye"></i> View Site</a>
      <a href="{{ url_for('admin_logout') }}" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block admin_content %}{% endblock %}
  </main>

</body>
</html>
